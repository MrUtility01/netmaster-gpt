name: Build Installable APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "SRC=$SRC"
          test -n "$SRC" && test -s "$SRC"
          cp "$SRC" dist/NetMaster-Learning.apk
          ls -lh dist/NetMaster-Learning.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetMaster-Learning-APK
          path: dist/NetMaster-Learning.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-complete
          name: NetMaster Learning 1.0.0-complete
          body: |
            ## NetMaster Learning — Complete 1.0.0

            Debug APK آماده نصب.

            - Application ID: `com.example.netmaster`
            - Version: 1.0.0-complete
            - Creator: مهندس مسعود جوکار

            اگر نسخه قبلی نصب است اول حذف کنید.
          files: dist/NetMaster-Learning.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
